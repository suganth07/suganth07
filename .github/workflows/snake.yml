name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: suganth07
          # The first color_dots item represents empty contribution cells.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0891B2&color_dots=#E2E8F0,#C4B5FD,#A78BFA,#7C3AED,#5B21B6
            dist/github-contribution-grid-snake-dark.svg?color_snake=#10B981&color_dots=#2d3343,#1E3A5F,#0891B2,#22D3EE,#A78BFA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
